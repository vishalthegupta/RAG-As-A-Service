# Development overrides - automatically loaded in dev
version: '3.8'

services:
  api:
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DEBUG=True

  worker:
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
