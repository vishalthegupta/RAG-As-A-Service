[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (require DB, Redis, etc.)
    slow: Slow tests (model loading, etc.)

# Coverage
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Ignore
norecursedirs = .git .venv venv __pycache__ *.egg-info
